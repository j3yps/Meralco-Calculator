<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERALCO CALCULATOR</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --calc-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --btn-eq: #10b981;
            --btn-eq-hover: #059669;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background-color: var(--calc-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 440px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .calculator h1 {
            font-size: 1.25rem;
            text-align: center;
            color: var(--accent-color);
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .calc-btn {
            background-color: var(--btn-eq);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
            margin-top: 4px;
        }

        .calc-btn:hover {
            background-color: var(--btn-eq-hover);
        }

        /* Results Styling */
        .result-box {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .step-result {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .step-result span:last-child {
            color: var(--text-primary);
            font-weight: 600;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 2px 0;
        }

        .total-row {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        /* Final Output Separate Section */
        .final-section {
            background: rgba(244, 63, 94, 0.08);
            border: 1px dashed rgba(244, 63, 94, 0.3);
            border-radius: 10px;
            padding: 14px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .final-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .final-value {
            font-size: 2rem;
            font-weight: 700;
            color: #f43f5e;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h1>MERALCO CALCULATOR</h1>
        
        <div class="input-row">
            <div class="input-group">
                <label for="prevMonthName">Previous Month Name</label>
                <input type="text" id="prevMonthName" placeholder="e.g. Oct 2026">
            </div>
            <div class="input-group">
                <label for="currMonthName">Current Month Name</label>
                <input type="text" id="currMonthName" placeholder="e.g. Nov 2026">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="prevReading">Prev Meter Reading (kWh)</label>
                <input type="number" id="prevReading" placeholder="0.00" step="any">
            </div>
            <div class="input-group">
                <label for="currReading">Curr Meter Reading (kWh)</label>
                <input type="number" id="currReading" placeholder="0.00" step="any">
            </div>
        </div>

        <div class="input-group">
            <label for="ratePerKwh">Current Rate per kWh (₱)</label>
            <input type="number" id="ratePerKwh" placeholder="0.00" step="any">
        </div>

        <button class="calc-btn" id="calculateBtn">Calculate</button>

        <div class="result-box">
            <div class="step-result">
                <span>Consumption:</span>
                <span id="resConsumption">0.00 kWh</span>
            </div>
            <div class="step-result">
                <span>Total Cost:</span>
                <span id="resTotalCost">₱0.00</span>
            </div>
            
            <div class="divider"></div>

            <div class="step-result total-row">
                <span>40%:</span>
                <span id="resFortyPercent">₱0.00</span>
            </div>
        </div>

        <!-- Separate Final Computation Section -->
        <div class="final-section">
            <div class="final-label">Final Output</div>
            <div class="final-value" id="resFinal">₱0.00</div>
        </div>
    </div>

    <script>
        // Automatically populate month and year on load
        function setInitialMonths() {
            const now = new Date();
            
            // Current Month & Year
            const currOptions = { month: 'short', year: 'numeric' };
            document.getElementById('currMonthName').value = now.toLocaleDateString('en-US', currOptions);

            // Previous Month & Year
            now.setMonth(now.getMonth() - 1);
            const prevOptions = { month: 'short', year: 'numeric' };
            document.getElementById('prevMonthName').value = now.toLocaleDateString('en-US', prevOptions);
        }

        window.addEventListener('DOMContentLoaded', setInitialMonths);

        const prevReadingInput = document.getElementById('prevReading');
        const currReadingInput = document.getElementById('currReading');
        const ratePerKwhInput = document.getElementById('ratePerKwh');
        const calculateBtn = document.getElementById('calculateBtn');

        const resConsumption = document.getElementById('resConsumption');
        const resTotalCost = document.getElementById('resTotalCost');
        const resFortyPercent = document.getElementById('resFortyPercent');
        const resFinal = document.getElementById('resFinal');

        function formatCurrency(amount) {
            return '₱' + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatNumber(num) {
            return Number(num).toLocaleString('en-US', { maximumFractionDigits: 2 });
        }

        function calculate() {
            const prev = parseFloat(prevReadingInput.value) || 0;
            const curr = parseFloat(currReadingInput.value) || 0;
            const rate = parseFloat(ratePerKwhInput.value) || 0;

            const consumption = Math.abs(curr - prev);
            const totalCost = consumption * rate;
            const fortyPercent = totalCost * 0.4;
            const finalOutput = Math.abs(fortyPercent - totalCost);

            resConsumption.innerText = `${formatNumber(consumption)} kWh`;
            resTotalCost.innerText = formatCurrency(totalCost);
            resFortyPercent.innerText = formatCurrency(fortyPercent);
            resFinal.innerText = formatCurrency(finalOutput);
        }

        calculateBtn.addEventListener('click', calculate);

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    calculate();
                }
            });
        });
    </script>
</body>
</html>
